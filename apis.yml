name: Protagonist Therapeutics
description: >-
  Protagonist Therapeutics, Inc. is a clinical-stage biopharmaceutical company
  headquartered in Newark, California and founded in 2006. It discovers and
  develops peptide-based new chemical entities using a proprietary peptide
  discovery and engineering platform, targeting rare and prevalent diseases with
  significant unmet medical need. Lead programs include rusfertide, a hepcidin
  mimetic in Phase 3 for polycythemia vera, and icotrokinra (PN-235), an oral
  IL-23 receptor antagonist partnered with Johnson & Johnson. The company is
  publicly traded (Nasdaq: PTGX) following its 2016 IPO. It was surfaced as a
  portfolio company of Canaan Partners and added to the API Evangelist network;
  enrichment found no public developer API, OpenAPI, SDK, or agent surface.
